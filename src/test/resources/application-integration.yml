spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
  kafka:
    listener:
      auto-startup: true

fraud:
  engine:
    lock:
      # The integration tests run against PostgreSQL, which supports advisory locks.
      enabled: true
      timeout: PT2S
    messaging:
      outbox-publisher-enabled: true
      # The integration tests have a broker, so the dead letter depth is collected.
      dlq-metrics-enabled: true
