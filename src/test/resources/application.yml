spring:
  application:
    name: fraud-engine-test
  datasource:
    url: jdbc:h2:mem:fraud_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "TransactionEvaluatedEvent:com.capitec.connect.fraudengine.infrastructure.messaging.TransactionEvaluatedEvent"
        spring.json.trusted.packages: "com.capitec.connect.fraudengine.infrastructure.messaging"
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 3
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fraud-engine
          jwk-set-uri: http://localhost:8180/realms/fraud-engine/protocol/openid-connect/certs
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false

fraud:
  engine:
    evaluation:
      history-window: PT24H
    rules:
      high-amount:
        enabled: true
        thresholds:
          ZAR: 50000.00
        risk-score: 40
        severity: HIGH
      category-risk:
        enabled: true
        categories: [GAMBLING, CRYPTO]
        risk-score: 30
        severity: MEDIUM
      velocity:
        enabled: true
        threshold: 3
        window: 2m
        risk-score: 50
        severity: CRITICAL
      location-mismatch:
        enabled: true
        time-gap-threshold: 10m
        risk-score: 60
        severity: CRITICAL
    freeze-policy:
      enabled: true
      minimum-risk-score: 80
      minimum-severity: CRITICAL
    messaging:
      transaction-topic: transactions-topic
      evaluation-topic: fraud-alerts-topic
      account-actions-topic: account-actions-topic
      outbox-poll-delay-ms: 1000
      outbox-publisher-enabled: false

security:
  enabled: false

resilience4j:
  circuitbreaker:
    instances:
      fraudEngine:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5000
        failureRateThreshold: 50
  ratelimiter:
    instances:
      fraudEngine:
        limitForPeriod: 10000
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never