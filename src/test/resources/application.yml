spring:
  application:
    name: fraud-engine-test
  datasource:
    url: jdbc:h2:mem:fraud_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Mirrors the main configuration. Without it the consumer falls back to the Kafka default of
      # "latest" and skips any message that was produced before the consumer was assigned the
      # partition, which made the Kafka ingestion test depend on a startup race.
      group-id: fraud-engine-transactions
      auto-offset-reset: earliest
    listener:
      auto-startup: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "TransactionEvaluatedEvent:com.capitec.connect.fraudengine.infrastructure.messaging.TransactionEvaluatedEvent"
        spring.json.trusted.packages: "com.capitec.connect.fraudengine.infrastructure.messaging"
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 3
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fraud-engine
          # No jwk-set-uri here on purpose: a fixed one would point the tests at whichever
          # Keycloak happens to run on the developer's machine. The security tests that need a
          # real issuer register their own.

fraud:
  engine:
    evaluation:
      history-window: PT24H
      max-future-skew: PT5M
      max-past-skew: P7D
    lock:
      # H2 has no advisory lock support; the unit tests use the no-op implementation.
      enabled: false
      timeout: PT2S
    rules:
      high-amount:
        enabled: true
        thresholds:
          ZAR: 50000.00
          USD: 2500.00
        risk-score: 40
        severity: HIGH
      category-risk:
        enabled: true
        categories: [GAMBLING, CRYPTO]
        risk-score: 30
        severity: MEDIUM
      velocity:
        enabled: true
        threshold: 3
        window: 2m
        risk-score: 50
        severity: CRITICAL
      location-mismatch:
        enabled: true
        time-gap-threshold: 10m
        risk-score: 60
        severity: CRITICAL
    freeze-policy:
      enabled: true
      minimum-risk-score: 80
      minimum-severity: CRITICAL
    messaging:
      transaction-topic: transactions-topic
      evaluation-topic: fraud-alerts-topic
      account-actions-topic: account-actions-topic
      outbox-poll-delay-ms: 1000
      outbox-publisher-enabled: false
      batch-size: 20
      max-batches-per-poll: 100
      send-timeout-ms: 5000
      lease-margin-ms: 30000
      max-attempts: 10
      retention: P7D
      prune-batch-size: 500
      outbox-retention-sweep-ms: 3600000
      outbox-metrics-refresh-ms: 10000
      # The unit tests have no broker, so the dead letter depth is not collected.
      dlq-metrics-enabled: false
      dlq-metrics-refresh-ms: 30000

security:
  enabled: false

resilience4j:
  circuitbreaker:
    instances:
      fraudEngine:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5000
        failureRateThreshold: 50
        ignoreExceptions:
          - com.capitec.connect.fraudengine.api.exception.DuplicateTransactionException
          - com.capitec.connect.fraudengine.api.exception.UnsupportedCurrencyException
          - com.capitec.connect.fraudengine.api.exception.AccountLockTimeoutException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
  ratelimiter:
    instances:
      fraudEngine:
        limitForPeriod: 10000
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        fraud:
          evaluation:
            duration: true
          account:
            lock:
              wait: true