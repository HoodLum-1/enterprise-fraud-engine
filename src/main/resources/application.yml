spring:
  application:
    name: fraud-engine
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
    time-zone: UTC
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-engine-transactions
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "TransactionEvaluatedEvent:com.capitec.connect.fraudengine.infrastructure.messaging.TransactionEvaluatedEvent"
        spring.json.trusted.packages: "com.capitec.connect.fraudengine.infrastructure.messaging"
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      retries: 3
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/fraud-engine}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

fraud:
  engine:
    evaluation:
      history-window: PT24H
    rules:
      high-amount:
        enabled: true
        thresholds:
          ZAR: 50000.00
        risk-score: 40
        severity: HIGH
      category-risk:
        enabled: true
        categories: [GAMBLING, CRYPTO]
        risk-score: 30
        severity: MEDIUM
      velocity:
        enabled: true
        threshold: 3
        window: 2m
        risk-score: 50
        severity: CRITICAL
      location-mismatch:
        enabled: true
        time-gap-threshold: 10m
        risk-score: 60
        severity: CRITICAL
    freeze-policy:
      enabled: true
      minimum-risk-score: 80
      minimum-severity: CRITICAL
    messaging:
      transaction-topic: transactions-topic
      evaluation-topic: fraud-alerts-topic
      account-actions-topic: account-actions-topic
      outbox-poll-delay-ms: 1000
      outbox-publisher-enabled: true

server:
  port: 8080

security:
  enabled: ${SECURITY_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never

# Logging Configuration
logging:
  level:
    com.capitec.connect.fraudengine: INFO
    org.springframework.web: INFO
    org.apache.kafka: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

# Springdoc OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    tryItOutEnabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      fraudEngine:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30000
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.DataAccessException
        ignoreExceptions:
          - com.capitec.connect.fraudengine.api.exception.DuplicateTransactionException
          - com.capitec.connect.fraudengine.api.exception.UnsupportedCurrencyException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
          - jakarta.validation.ConstraintViolationException
          - org.springframework.web.bind.MethodArgumentNotValidException
  ratelimiter:
    instances:
      fraudEngine:
        limitForPeriod: 1000
        limitRefreshPeriod: 1s
        timeoutDuration: 0