spring:
  application:
    name: fraud-engine
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

fraud:
  engine:
    evaluation:
      history-window: PT24H
    rules:
      high-amount:
        enabled: true
        threshold: 50000.00
        risk-score: 40
        severity: HIGH
      velocity:
        enabled: true
        threshold: 3
        window: 2m
        risk-score: 50
        severity: CRITICAL
      location-mismatch:
        enabled: true
        time-gap-threshold: 10m
        risk-score: 60
        severity: CRITICAL

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
