openapi: 3.0.3
info:
  title: Enterprise Fraud Engine API
  version: 1.1.0
  description: >
    JWT-protected transaction evaluation, transaction lookup, fraud-alert retrieval,
    and fraud-case review. REST evaluation and Kafka transaction ingestion call the
    same evaluation service. Database-to-Kafka events are published through a
    PostgreSQL outbox with at-least-once delivery.
servers:
  - url: http://localhost:8080
    description: Local Compose stack

paths:
  /api/v1/transactions/evaluate:
    post:
      operationId: evaluateTransaction
      summary: Evaluate a transaction
      description: >
        Evaluates against configured amount, velocity, location, and category rules.
        Requires TRANSACTION_INGESTOR or FRAUD_ANALYST. A successful response is
        persisted before it is returned; a fraud case is created asynchronously only
        if the evaluation triggers a rule.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              accountId: ACC-998877
              amount: 55000.00
              currency: ZAR
              category: ELECTRONICS
              merchantName: MegaStore Cape Town
              location: Cape Town
              timestamp: '2026-10-10T20:00:00Z'
      responses:
        '201':
          description: Transaction evaluated and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate transaction ID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Evaluation rate limit exceeded; honor Retry-After.
          headers:
            Retry-After:
              schema:
                type: integer
              example: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Evaluation unavailable; request was not returned as a clean result.
          headers:
            Retry-After:
              schema:
                type: integer
              example: 5
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Retrieve a transaction evaluation
      description: Requires FRAUD_ANALYST or an authenticated owner matching the transaction account.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction details and its rule-triggered alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fraud-alerts/account/{accountId}:
    get:
      operationId: getFraudAlertsByAccount
      summary: Retrieve an account's fraud alerts
      description: >
        Requires FRAUD_ANALYST or an authenticated owner whose JWT account claim
        matches accountId. Results are ordered by flaggedAt descending by default.
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
        - name: ruleName
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive lower bound for alert flaggedAt.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive upper bound for alert flaggedAt.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of matching alerts (maximum page size 100).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAlertPage'
              example:
                content: []
                page:
                  size: 20
                  number: 0
                  totalElements: 0
                  totalPages: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fraud-cases:
    get:
      operationId: getFraudCases
      summary: Retrieve fraud cases
      description: Requires FRAUD_ANALYST. Only evaluations that trigger a fraud rule create cases.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Spring Data sort expression; defaults to createdAt,desc.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: A page of fraud cases (maximum page size 100).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCasePage'
              example:
                content: []
                page:
                  size: 20
                  number: 0
                  totalElements: 0
                  totalPages: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fraud-cases/transaction/{transactionId}:
    get:
      operationId: getFraudCaseByTransaction
      summary: Retrieve a case by transaction ID
      description: Requires FRAUD_ANALYST. Case creation is asynchronous after evaluation.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Fraud case details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fraud-cases/{transactionId}/status:
    patch:
      operationId: updateFraudCaseStatus
      summary: Update a fraud case status
      description: >
        Requires FRAUD_ANALYST. The authenticated principal is recorded as updatedBy.
        Allowed transitions are PENDING_REVIEW to CONFIRMED_FRAUD, FALSE_POSITIVE,
        or RESOLVED; CONFIRMED_FRAUD or FALSE_POSITIVE to RESOLVED. RESOLVED is terminal.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CaseStatus'
      responses:
        '200':
          description: Updated fraud case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Requested page size, capped by the server at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Spring Data sort expression, for example flaggedAt,desc.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
  responses:
    BadRequest:
      description: Invalid request, unsupported configured currency, or invalid filter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated principal lacks the required role or account ownership.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Requested transaction or fraud case was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    TransactionRequest:
      type: object
      required: [id, accountId, amount, currency, category, timestamp]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          maxLength: 64
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Only currencies with configured thresholds are accepted (ZAR, USD).
          example: ZAR
        category:
          type: string
          example: ELECTRONICS
        merchantName:
          type: string
          nullable: true
          maxLength: 100
        location:
          type: string
          nullable: true
          maxLength: 100
        timestamp:
          type: string
          format: date-time
          description: Transaction event time. It may be at most 5 minutes in the future and 7 days in the past; further out is rejected.
    EvaluationSummary:
      type: object
      required: [transactionId, accountId, totalRiskScore, overallSeverity, isFraudulent, alerts]
      properties:
        transactionId:
          type: string
          format: uuid
        accountId:
          type: string
        totalRiskScore:
          type: integer
        overallSeverity:
          $ref: '#/components/schemas/Severity'
        isFraudulent:
          type: boolean
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/FraudAlert'
    TransactionDetails:
      allOf:
        - $ref: '#/components/schemas/EvaluationSummary'
        - type: object
          properties:
            amount:
              type: number
              format: double
            currency:
              type: string
            category:
              type: string
            merchantName:
              type: string
              nullable: true
            location:
              type: string
              nullable: true
            timestamp:
              type: string
              format: date-time
    FraudAlert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        accountId:
          type: string
        ruleName:
          type: string
        riskScore:
          type: integer
        severity:
          $ref: '#/components/schemas/Severity'
        reason:
          type: string
        flaggedAt:
          type: string
          format: date-time
    FraudCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        accountId:
          type: string
        totalRiskScore:
          type: integer
        overallSeverity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/CaseStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
    FraudAlertPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FraudAlert'
        page:
          $ref: '#/components/schemas/PageMetadata'
    FraudCasePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FraudCase'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          description: Effective page size after the server's maximum-size cap.
        number:
          type: integer
          description: Zero-based page index.
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    CaseStatus:
      type: string
      enum: [PENDING_REVIEW, CONFIRMED_FRAUD, FALSE_POSITIVE, RESOLVED]
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        invalidParams:
          type: object
          additionalProperties:
            type: string
