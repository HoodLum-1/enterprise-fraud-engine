name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start infrastructure services via Docker Compose
        run: docker compose up -d postgres zookeeper kafka keycloak

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL TCP port to be ready..."
          until docker compose exec -T postgres pg_isready -h 127.0.0.1 -U postgres -d fraud_db; do
            sleep 2
          done

          echo "Waiting for Keycloak to boot up..."
          for i in {1..60}; do
            if curl --output /dev/null --silent --head --fail http://localhost:9000/health/ready; then
              echo "Keycloak is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: Keycloak failed to start in time. Container logs:"
              docker compose logs keycloak
              exit 1
            fi
            sleep 3
          done

          echo "Waiting for Kafka..."
          until nc -z localhost 9092; do
            sleep 2
          done
          echo "All infrastructure services are up and healthy!"

      - name: Run unit and integration test suites
        run: ./mvnw --batch-mode verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fraud_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/fraud-engine

      - name: Check API contract artifacts
        run: python3 scripts/check_api_contract.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag enterprise-fraud-engine:${{ github.sha }} .
